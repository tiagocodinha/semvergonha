<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Virtual Tour | Sem Vergonha</title>
  <meta name="description" content="Visita virtual 360° ao Sem Vergonha.">

  <!-- ==========================================================
       PAGINA INVISIVEL
       - noindex/nofollow/noarchive  -> fora dos motores de busca
       - header X-Robots-Tag no vercel.json (cobre tambem as imagens 360)
       - sem entrada no sitemap.xml nem no robots.txt
       - sem links a apontar para aqui em nenhuma outra pagina
       ========================================================== -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">

  <!-- Sem Open Graph de proposito: evita pre-visualizacoes em redes sociais -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/virtualtour/vendor/pannellum.css">
  <link rel="stylesheet" href="/virtualtour/tour.css">
</head>
<body class="tour-page is-intro">

  <!-- ============================ NAV ============================ -->
  <nav class="nav nav--faded" id="nav">
    <a href="/" class="nav__logo">
      <img src="/assets/semvergonha_logo.png" alt="Sem Vergonha" class="nav__logo-img">
    </a>
    <div class="nav__links">
      <a href="/food-drinks/">FOOD &amp; DRINKS</a>
      <a href="/contactos/" data-i18n="nav.contacts">CONTACTOS</a>
    </div>
    <div class="nav__actions">
      <a href="#" class="nav__cta umai-reserve" data-i18n="reserve">Reservar Mesa</a>
      <button class="lang-toggle" aria-label="Language">EN</button>
    </div>
    <button class="nav__burger" id="burger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ========================= MOBILE MENU ========================= -->
  <div class="mob-menu" id="mobMenu">
    <div class="mob-menu__inner">
      <a href="/food-drinks/">FOOD &amp; DRINKS</a>
      <a href="/contactos/" data-i18n="nav.contacts">CONTACTOS</a>
      <a href="#" class="mob-menu__cta umai-reserve" data-i18n="reserve">Reservar Mesa</a>
      <button class="lang-toggle">EN</button>
    </div>
  </div>

  <!-- ============================ CAPA ============================
       Primeira imagem antes de entrar na visita. Mesmo tratamento do
       hero do site: foto, camada escura, logo e botao.
       ================================================================ -->
  <header class="tcover" id="cover">
    <div class="tcover__slides" id="coverSlides">
      <div class="tcover__slide is-on"><img src="/assets/semvergonha.jpg" alt="Sala do Sem Vergonha" fetchpriority="high"></div>
      <div class="tcover__slide"><img src="/assets/semvergonha1.webp" alt="Bar do Sem Vergonha" loading="lazy"></div>
      <div class="tcover__slide"><img src="/assets/semvergonha2.webp" alt="Ambiente do Sem Vergonha" loading="lazy"></div>
    </div>
    <div class="tcover__overlay"></div>

    <div class="tcover__content">
      <img src="/assets/semvergonha_logo.png" alt="Sem Vergonha" class="tcover__logo">
      <span class="label label--light" data-i18n="cover.label">Virtual Tour 360°</span>
      <h1 data-i18n="cover.h1">Entra.<br>Sem vergonha.</h1>
      <button type="button" class="tbtn tbtn--fill" id="startBtn">
        <span data-i18n="cover.cta">Começar a visita</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>

    <div class="tcover__dots" id="coverDots" aria-hidden="true"></div>
  </header>

  <!-- ============================ TOUR ============================ -->
  <main class="tour" id="tour" aria-hidden="true">

    <!-- Motor 360 -->
    <div class="tour__pano" id="pano"></div>
    <div class="tour__vignette"></div>

    <!-- Veu das transicoes entre cenas -->
    <div class="tveil" id="veil" aria-hidden="true">
      <div class="tveil__inner">
        <span class="label label--light" id="veilCount"></span>
        <strong id="veilTitle"></strong>
      </div>
    </div>

    <!-- Erro / imagem ainda por adicionar -->
    <div class="tmissing" id="missing" hidden>
      <div class="tmissing__box">
        <span class="label" data-i18n="err.label">Em preparação</span>
        <p data-i18n="err.p">Esta imagem 360° ainda não está disponível.</p>
      </div>
    </div>

    <!-- Progresso (clicavel) -->
    <ol class="tprogress" id="progress" aria-label="Espaços"></ol>

    <!-- Controlos -->
    <div class="tctrl" id="ctrl">
      <button type="button" class="tctrl__btn" id="btnSpaces" aria-label="Espaços" data-i18n-aria="ctrl.spaces">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <button type="button" class="tctrl__btn" id="btnZoomIn" aria-label="Zoom +">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" class="tctrl__btn" id="btnZoomOut" aria-label="Zoom -">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button type="button" class="tctrl__btn" id="btnRotate" aria-label="Rotação automática" data-i18n-aria="ctrl.rotate" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      </button>
      <button type="button" class="tctrl__btn" id="btnGyro" aria-label="Giroscópio" data-i18n-aria="ctrl.gyro" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
      </button>
      <button type="button" class="tctrl__btn" id="btnFull" aria-label="Ecrã inteiro" data-i18n-aria="ctrl.full">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <!-- Cartao de descricao da cena -->
    <section class="tinfo" id="info" aria-live="polite">
      <button type="button" class="tinfo__toggle" id="infoToggle" aria-label="Mostrar / esconder descrição" data-i18n-aria="info.toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <div class="tinfo__body" id="infoBody">
        <span class="label label--light tinfo__count" id="infoCount"></span>
        <h2 id="infoTitle"></h2>
        <p id="infoText"></p>
        <ul class="tinfo__tags" id="infoTags"></ul>
        <div class="tinfo__nav">
          <button type="button" class="tbtn tbtn--ghost" id="btnPrev">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            <span data-i18n="nav.prev">Anterior</span>
          </button>
          <button type="button" class="tbtn tbtn--fill" id="btnNext">
            <span data-i18n="nav.next">Seguinte</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <!-- So aparece na ultima cena -->
          <a href="#" class="tbtn tbtn--fill umai-reserve" id="btnReserve" hidden data-i18n="reserve">Reservar Mesa</a>
          <button type="button" class="tbtn tbtn--ghost" id="btnRestart" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
            <span data-i18n="nav.restart">Recomeçar</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Gaveta de espacos -->
    <aside class="tdrawer" id="drawer" aria-hidden="true">
      <div class="tdrawer__head">
        <span class="label label--light" data-i18n="drawer.label">Os espaços</span>
        <button type="button" class="tdrawer__close" id="drawerClose" aria-label="Fechar" data-i18n-aria="drawer.close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="tdrawer__list" id="drawerList"></div>
    </aside>

    <!-- Dica inicial -->
    <div class="thint" id="hint" aria-hidden="true">
      <svg viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h40M10 6l-6 6 6 6M38 6l6 6-6 6"/></svg>
      <span data-i18n="hint.drag">Arrasta para olhar à volta</span>
    </div>

    <!-- Toast (modo de edicao) -->
    <div class="ttoast" id="toast" hidden></div>
  </main>

  <script src="/virtualtour/vendor/pannellum.js"></script>
  <script src="/virtualtour/scenes.js"></script>
  <script src="/virtualtour/tour.js"></script>

  <!-- Reserva de mesa (CoverManager) -->
  <script src="/js/reservas.js"></script>
</body>
</html>
